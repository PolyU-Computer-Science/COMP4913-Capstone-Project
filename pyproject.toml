[project]
name = "email_assistant"
version = "0.5.0"
description = "A human-supervised multi-mailbox agentic AI email automation system"
authors = [{ name = "Cheng Chi Wa (PolyU 25063091D)" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,google-genai,litellm,tools]>=1.15.9,<2.0.0",
    "imap-tools>=1.14.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=49.0.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["email_assistant*", "backend*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
email_assistant = "email_assistant.main:run"
run_crew = "email_assistant.main:run"
train = "email_assistant.main:train"
replay = "email_assistant.main:replay"
test = "email_assistant.main:test"
run_with_trigger = "email_assistant.main:run_with_trigger"
api = "backend.app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.crewai]
type = "crew"
